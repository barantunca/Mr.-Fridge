name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodları İndir (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Sistem Kütüphanelerini Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Buildozer ve Cython Yükle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade Cython==0.29.33 virtualenv buildozer

      - name: Buildozer ile APK Derle
        run: buildozer android debug

      - name: APK Dosyasını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Mr-Fridge-APK
          path: bin/*.apk
